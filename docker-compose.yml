networks:
  commerce-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
  postgres-data:

services:
  nginx-gateway:
    build: ./nginx
    container_name: commerce-nginx
    ports:
      - "5000:5000"
    depends_on:
      - products-service
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    networks:
      - commerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:17-alpine
    container_name: commerce-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: preworkmoment12@
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - commerce-network
  products-service:
    build: "./services/products-service"
    ports:
      - 5001
    container_name: commerce-products
    command: "./docker.entrypoint.sh"
    volumes:
      - "./services/products-service:/app"
    environment:
      - CHOKIDAR_USEPOLLING=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - commerce-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: commerce-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - commerce-network
    depends_on:
      - loki
  loki:
    image: grafana/loki:3.0.0
    container_name: commerce-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - commerce-network
